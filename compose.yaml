services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_command_center
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U incident -d incident_command_center']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: incident-command-center:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ['npm', 'run', 'start', '--workspace', '@incident-command-center/api']
    environment:
      DATABASE_URL: postgres://incident:incident@postgres:5432/incident_command_center
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: incident-command-center:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ['npm', 'run', 'start', '--workspace', '@incident-command-center/worker']
    environment:
      DATABASE_URL: postgres://incident:incident@postgres:5432/incident_command_center
      EVALUATION_MODE: ${EVALUATION_MODE:-live}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13.0}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: incident-command-center:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      ['npm', 'run', 'start', '--workspace', '@incident-command-center/web']
    environment:
      API_INTERNAL_BASE_URL: http://api:3001
      PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - api
      - worker

volumes:
  postgres-data:
